# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995              # 99.5% availability: 3.6h allowed downtime per 30d for predictive maintenance
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    on_budget_exhausted: |
      Freeze non-emergency deployments to staging and production. Page on-call MLOps
      engineer via PagerDuty/Slack. If error spike correlates with a recent release,
      automatically roll back to the previous stable container image. Require an RCA
      post-mortem before resuming feature releases.

  - name: latency
    target_p95_ms: 200         # Matches p95 < 200ms threshold in loadtest/k6.js
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Trigger P2 latency alert. Verify endpoint CPU/memory utilization. If resource-bound,
      scale up min_replica_count or upgrade instance machine type. If algorithmic, profile
      model inference and block promotion of models exceeding latency budget in CI.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Trigger automated retraining pipeline job on the latest verified window of sensor data.
      Run evaluation gate against current champion; notify ML Lead for promotion sign-off.
      If upstream training data is unavailable or failing validation, escalate to Data Platform team.
