# ITCS355 Lab 4 — continuous deployment.
#
# Runs only on main, only after CI is green. Credentials come from OIDC federation, not
# from stored keys.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Push image
        run: |
          python -c "from src import config; from cloudlayer.factory import get_adapter; \
            print(get_adapter(config.load(strict=False)).push_image('itcs355-serve:${{ github.sha }}'))"

      - name: Deploy to staging
        run: |
          python -c "from src import config; from cloudlayer.factory import get_adapter; \
            cfg = config.load(strict=False); adapter = get_adapter(cfg); \
            image_ref = f'{cfg.container_registry}/itcs355-serve:${{ github.sha }}'; \
            print(adapter.deploy(image_ref, 'itcs355-staging', 'e2-standard-4'))"

      - name: Smoke test
        run: |
          python scripts/smoke_test.py --target itcs355-staging
